<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data: https:; frame-src 'self';" />
  <title>MD Viewer</title>
  <link rel="stylesheet" href="ui.css" />
</head>
<!-- One document tab: the viewer and, in edit mode, the source editor
     beside it. Runs in an iframe of the window page's tab area, or of a
     tab window (see the tab host in main.js); the window page is
     index.html. -->
<body class="doc-page">
  <div id="app-shell">
    <main id="preview-pane">
      <div class="preview-toolbar">
        <div class="toolbar-nav">
          <button id="btn-nav-back" class="toolbar-icon-btn" disabled
            data-i18n-title="toolbar.navBackTitle" title="뒤로 (마우스 뒤로 버튼)">&#x2190;</button>
          <button id="btn-nav-forward" class="toolbar-icon-btn" disabled
            data-i18n-title="toolbar.navForwardTitle" title="앞으로 (마우스 앞으로 버튼)">&#x2192;</button>
        </div>
        <span id="current-file-name"></span>
        <div class="toolbar-right">
          <span id="edit-status" class="edit-status"></span>
          <button id="zoom-indicator" class="zoom-indicator hidden"
            data-i18n-title="toolbar.zoomResetTitle" title="확대/축소를 100%로 되돌리기 (Ctrl+0)">100%</button>
          <button id="btn-fullscreen" class="toolbar-icon-btn hidden"
            data-i18n-title="toolbar.fullscreenTitle" title="현재 문서 전체화면으로 보기 (F11)">⛶</button>
          <button id="btn-full-width" class="toolbar-icon-btn hidden"
            data-i18n-title="toolbar.fullWidthTitle" title="보기창 가로폭 제한 켜기/끄기">↔</button>
          <button id="btn-editor-layout" class="toolbar-icon-btn hidden"
            data-i18n-title="toolbar.editorLayoutTitle" title="편집창 배치를 좌우/상하로 전환">⇅</button>
          <button id="btn-save-source" class="btn-primary hidden" data-i18n="toolbar.saveBtn" data-i18n-title="toolbar.saveTitle" title="저장 (Ctrl+S)">저장</button>
          <button id="btn-refresh-puml" class="hidden" data-i18n="toolbar.refreshBtn" data-i18n-title="toolbar.refreshTitle" title="디스크에서 파일 다시 불러오기">새로고침</button>
          <button id="btn-toggle-edit" data-i18n="toolbar.editBtn" data-i18n-title="toolbar.editTitle" title="본문 편집 모드 전환 (Ctrl+Shift+E)">편집</button>
          <span id="instant-view-badge" class="instant-view-badge hidden" data-i18n-title="drop.instantViewTitle" title="프로젝트 밖 파일을 임시로 보는 중입니다">
            <span class="instant-view-dot"></span><span data-i18n="drop.instantViewBadge">임시 보기</span>
          </span>
          <span id="css-applied-badge" class="css-applied-badge" data-i18n-title="toolbar.cssAppliedTitle" title="커스텀 CSS 적용됨">
            <span class="css-applied-dot"></span><span data-i18n="toolbar.cssAppliedBadge">커스텀 CSS</span>
          </span>
        </div>
      </div>

      <div id="find-bar" class="find-bar hidden">
        <input id="find-input" type="text" spellcheck="false"
          data-i18n-placeholder="find.placeholder" placeholder="문서 내 찾기" />
        <span id="find-count" class="find-count"></span>
        <button id="find-prev" data-i18n-title="find.prevTitle" title="이전 항목 (Shift+Enter)">▲</button>
        <button id="find-next" data-i18n-title="find.nextTitle" title="다음 항목 (Enter)">▼</button>
        <button id="find-close" data-i18n-title="find.closeTitle" title="닫기 (Esc)">✕</button>
      </div>

      <div id="json-path-bar" class="json-path-bar hidden"></div>

      <div id="preview-body" class="preview-body">
        <div id="editor-pane" class="hidden">
          <div id="editor-highlight" aria-hidden="true"></div>
          <div id="editor-syntax" aria-hidden="true"></div>
          <textarea id="md-source-editor" spellcheck="false"
            data-i18n-placeholder="editor.placeholder" placeholder="마크다운 소스를 입력하세요"></textarea>
        </div>
        <div id="editor-resizer" class="resizer hidden">
          <button id="btn-scroll-sync" class="scroll-sync-btn" tabindex="-1"
            data-i18n-title="editor.scrollSyncOnTitle" title="스크롤 동기화 켜짐: 누르면 편집창과 보기창을 따로 스크롤">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M5.5 7V4.5a2.5 2.5 0 0 1 5 0V7M5.5 9v2.5a2.5 2.5 0 0 0 5 0V9M8 5.5v5" />
              <path class="scroll-sync-slash" d="M2.5 2.5l11 11" />
            </svg>
          </button>
        </div>
        <iframe id="preview-frame" title="markdown preview" sandbox="allow-same-origin"></iframe>
        <aside id="toc-panel" class="toc-panel">
          <div id="toc-panel-header" class="toc-panel-header" role="button" tabindex="0" data-i18n-title="toc.collapseTitle" title="목차 접기/펼치기">
            <span class="toc-panel-title" data-i18n="toc.heading">목차</span>
            <button id="toc-collapse-btn" class="toc-collapse-btn" tabindex="-1" aria-hidden="true">
              <span id="toc-chevron" class="toc-chevron">▸</span>
            </button>
          </div>
          <div class="toc-panel-body">
            <div class="toc-section">
              <h3 data-i18n="toc.heading">목차</h3>
              <ul id="toc-list" class="toc-list"></ul>
            </div>
            <div class="toc-section">
              <h3 data-i18n="toc.links">링크</h3>
              <ul id="toc-links-list" class="toc-list"></ul>
            </div>
            <div class="toc-section">
              <h3 data-i18n="toc.subpages">하위 페이지</h3>
              <div id="toc-siblings-list" class="toc-list"></div>
            </div>
          </div>
        </aside>
      </div>

      <div id="viewer-drop-overlay" class="drop-overlay hidden">
        <div class="drop-overlay-inner">
          <div class="drop-overlay-icon">👁</div>
          <div class="drop-overlay-text" data-i18n="drop.viewerHint">놓으면 바로 보기</div>
          <div class="drop-overlay-sub" data-i18n="drop.viewerHintSub">프로젝트에 복사하지 않습니다</div>
        </div>
      </div>

      <button id="btn-exit-fullscreen" class="fullscreen-exit hidden"
        data-i18n-title="fullscreen.exitTitle" title="전체화면 종료 (Esc)">✕</button>
      <div id="fullscreen-hint" class="fullscreen-hint" data-i18n="fullscreen.hint">Esc 또는 F11을 누르면 전체화면이 종료됩니다</div>
    </main>
  </div>

  <!-- Generated by scripts/prepare-highlight.js; the editor works without it, just uncoloured code. -->
  <script src="vendor/highlight/highlight.js"></script>
  <script src="code-languages.js"></script>
  <script src="common.js"></script>
  <script src="doc.js"></script>
</body>
</html>
