<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data:;" />
  <title>mermaid renderer</title>
  <style>
    html, body { margin: 0; background: #ffffff; }
    /* Parked off-screen rather than hidden: mermaid measures laid-out text to
       size its diagrams, and display:none leaves nothing to measure. */
    #mermaid-host {
      position: absolute;
      top: 0;
      left: -20000px;
      width: 1400px;
    }
  </style>
</head>
<body>
  <div id="mermaid-host"></div>
  <script src="mermaid-render.js"></script>
</body>
</html>
